<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>经纬之间｜内容后台</title>
    <style>
      :root { color-scheme: dark; font-family: Inter, "PingFang SC", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: radial-gradient(circle at 70% 20%, #173d74 0, transparent 34%), #040a12; color: #f4f7fb; }
      main { width: min(620px, 100%); padding: clamp(30px, 7vw, 64px); border: 1px solid rgba(115, 180, 255, .28); border-radius: 22px; background: rgba(8, 20, 36, .88); box-shadow: 0 30px 90px rgba(0, 0, 0, .35); }
      small { color: #73b4ff; letter-spacing: .18em; }
      h1 { margin: 18px 0; font-size: clamp(38px, 8vw, 62px); letter-spacing: -.05em; }
      p { color: #aebdd0; line-height: 1.9; }
      a { display: inline-flex; margin-top: 22px; padding: 15px 22px; border-radius: 10px; background: #2876f4; color: white; font-weight: 650; text-decoration: none; }
      a:focus-visible { outline: 3px solid #ffb454; outline-offset: 4px; }
    </style>
  </head>
  <body>
    <main>
      <small>CONTENT ADMIN</small>
      <h1>内容后台</h1>
      <p>使用 GitHub 登录后，即可表单化修改首页文字、成长时间线、项目经历、研究方向和地点相册。电脑和手机浏览器均可上传照片，保存后网站会自动重新发布。</p>
      <a href="https://app.pagescms.org/" rel="noreferrer">使用 GitHub 登录并编辑 ↗</a>
    </main>
  </body>
</html>
